<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Учебный кликер о Чебурашке, который учится перепрыгивать мандарины."
    />
    <title>Чебурашка: мандариновый забег</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="intro">
        <p class="eyebrow">День 6 из 70</p>
        <h1>Мандариновый забег</h1>
        <p class="subtitle">
          Чебурашка научился прыгать! Нажми «Старт», затем кликни по площадке,
          чтобы он подпрыгнул.
        </p>
      </header>

      <section class="game-card" aria-labelledby="game-title">
        <div class="game-card__header">
          <div>
            <p class="label">Тренировочная площадка</p>
            <h2 id="game-title">Первый прыжок</h2>
          </div>
          <div class="score" aria-label="Количество тренировочных прыжков">
            <span class="score__label">Прыжки</span>
            <span class="score__value" id="score">0</span>
          </div>
        </div>

        <div class="playfield" id="playfield" role="button" tabindex="-1" aria-label="Тренировочное поле" aria-disabled="true">
          <div class="cloud cloud--one" aria-hidden="true"></div>
          <div class="cloud cloud--two" aria-hidden="true"></div>
          <div class="character" id="character" aria-label="Чебурашка" role="img">
            <div class="character__body" aria-hidden="true"></div>
            <div class="character__head" aria-hidden="true">
              <span class="character__ear character__ear--left"></span>
              <span class="character__ear character__ear--right"></span>
              <span class="character__face">
                <span class="character__eye character__eye--left"></span>
                <span class="character__eye character__eye--right"></span>
                <span class="character__nose"></span>
                <span class="character__smile"></span>
              </span>
            </div>
          </div>
          <div class="obstacles" id="obstacles" aria-label="Мандарин" role="img">
            <span class="obstacle" aria-hidden="true"></span>
          </div>
          <div class="ground" aria-hidden="true"></div>
        </div>

        <div class="game-card__footer">
          <p id="message">Нажми «Старт», чтобы начать тренировку.</p>
          <span class="status" data-state="ready">
            <span class="status__dot"></span>
            <span id="game-status">Готов</span>
          </span>
        </div>
        <div class="game-controls">
          <button class="control-button" id="start-button" type="button">Старт</button>
          <button class="control-button control-button--secondary" id="finish-button" type="button" disabled>Завершить</button>
        </div>
      </section>

      <footer class="page-footer">
        <span>Учебный проект на HTML, CSS и JavaScript</span>
        <span>Версия 0.6</span>
      </footer>
    </main>
  </body>
</html>
