<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Учебный кликер о Чебурашке, который учится перепрыгивать мандарины."
    />
    <title>Чебурашка: мандариновый забег</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="intro">
        <p class="eyebrow">День 1 из 70</p>
        <h1>Мандариновый забег</h1>
        <p class="subtitle">
          Чебурашка готовится к большому прыжку. Сегодня знакомимся с его
          тренировочной площадкой.
        </p>
      </header>

      <section class="game-card" aria-labelledby="game-title">
        <div class="game-card__header">
          <div>
            <p class="label">Тренировочная площадка</p>
            <h2 id="game-title">Прыжок ещё впереди</h2>
          </div>
          <div class="score" aria-label="Счёт">
            <span class="score__label">Счёт</span>
            <span class="score__value" id="score">0</span>
          </div>
        </div>

        <div class="playfield" id="playfield" role="button" tabindex="0" aria-label="Тренировочное поле">
          <div class="cloud cloud--one" aria-hidden="true"></div>
          <div class="cloud cloud--two" aria-hidden="true"></div>
          <div class="character" aria-label="Чебурашка" role="img">🧸</div>
          <div class="mandarins" aria-label="Мандарины" role="img">🍊 🍊</div>
          <div class="ground" aria-hidden="true"></div>
        </div>

        <div class="game-card__footer">
          <p id="message">Кликни по площадке — начнём тренировку реакции.</p>
          <span class="status"><span class="status__dot"></span> Подготовка</span>
        </div>
      </section>

      <footer class="page-footer">
        <span>Учебный проект на HTML, CSS и JavaScript</span>
        <span>Версия 0.1</span>
      </footer>
    </main>
  </body>
</html>
